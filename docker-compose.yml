services:
  wa-gateway:
    build: .
    container_name: wa-gateway-service
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=wa_gateway
      - DB_PORT=5432

  db:
    image: postgres:15
    container_name: wa-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: wa_gateway
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
